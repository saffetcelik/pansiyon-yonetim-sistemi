version: '3.8'

services:
  db:
    image: postgres:17-alpine
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres_secure_pass_123
      POSTGRES_DB: pansiyondb
    volumes:
      - pgdata:/var/lib/postgresql/data
    # Exposing the port internally within the docker network
    expose:
      - "5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d pansiyondb"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: always
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ASPNETCORE_HTTP_PORTS=8080
      - ConnectionStrings__DefaultConnection=Host=db;Port=5432;Database=pansiyondb;Username=postgres;Password=postgres_secure_pass_123
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - backup_data:/app/App_Data/Backups
    expose:
      - "8080" # Coolify will use this port or whichever ASPNETCORE_HTTP_PORTS is set to

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    restart: always
    depends_on:
      - backend
    expose:
      - "80" # Nginx runs on 80 by default

volumes:
  pgdata:
  backup_data:
